[project]
name = "voxdelta"
version = "0.1.0"
description = "Local-first call analysis backend for VoxDelta"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.10,<2",
    "datasets>=4,<5",
    "fastapi>=0.116,<1",
    "faster-whisper>=1.2.1,<2",
    "funasr>=1.4.2,<2",
    "httpx>=0.28,<1",
    "joblib>=1.5,<2",
    "orjson>=3.10,<4",
    "pandas>=2.3,<3",
    "pyannote-audio>=4.0.7,<5",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "python-multipart>=0.0.20,<1",
    "qwen-asr>=0.0.6,<0.1",
    "scikit-learn>=1.7,<2",
    "torch>=2.8,<3",
    "torchaudio>=2.8,<3",
    "transformers>=4.55,<5",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]
